services:
  posts:
    image: posts
    hostname: posts
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      STORAGE_TYPE: "postgres"
      GRAPHQL_PORT: "8080"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "posts"
      POSTGRES_USER: "posts_user"
      POSTGRES_PASSWORD: "12345"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: "posts"
      POSTGRES_USER: "posts_user"
      POSTGRES_PASSWORD: "12345"
      POSTGRES_PORT: "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "port=5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U posts_user -d posts" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
